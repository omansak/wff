[package]
name = "wff"
version = "0.1.1"
edition = "2024"
authors = ["OMANSAK"]
description = "Lightweight Fuzzy File Finder for Windows (W Fuzzy Finder)"

[dependencies]
fff-search = { version = "0.11.0", features = ["definitions"] }
i-slint-backend-winit = { version = "1.18.1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.18.1"
